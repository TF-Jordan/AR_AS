# ==============================================================================
# Docker Compose - AR_AS Système Complet
# ==============================================================================
# Build avec réseau hôte (utilise cache apt local):
#   docker compose build
#
# Lancement:
#   docker compose up -d
# ==============================================================================

services:
  # ============================================================================
  # API FastAPI
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: ar-as-api:latest
    container_name: ar-as-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=AR_AS Recommendation System
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_PREFIX=/api/v1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ar_as_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - APM_ENABLED=${APM_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - api-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ============================================================================
  # Celery Worker
  # ============================================================================
  celery-worker:
    image: ar-as-api:latest
    container_name: ar-as-worker
    command: >
      celery -A src.modules.module3_orchestration.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ar_as_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - worker-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # Celery Beat (Scheduler)
  # ============================================================================
  celery-beat:
    image: ar-as-api:latest
    container_name: ar-as-beat
    command: >
      celery -A src.modules.module3_orchestration.celery_app beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - beat-data:/tmp
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # Flower (Monitoring Celery)
  # ============================================================================
  flower:
    image: ar-as-api:latest
    container_name: ar-as-flower
    command: >
      celery -A src.modules.module3_orchestration.celery_app flower
      --port=5555
      --persistent=True
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ar-as-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ar_as_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ar-as-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Qdrant (Vector Database)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ar-as-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ar-as-network
    restart: unless-stopped

networks:
  ar-as-network:
    driver: bridge
    name: ar-as-network

volumes:
  api-logs:
  worker-logs:
  beat-data:
  postgres-data:
  redis-data:
  qdrant-data:
