# ==============================================================================
# Docker Compose - AR_AS Système Complet
# ==============================================================================
# Build:
#   docker compose build
#
# Lancement (sans monitoring):
#   docker compose up -d
#
# Lancement (avec monitoring ELK + APM):
#   docker compose --profile monitoring up -d
#
# ==============================================================================

services:
  # ============================================================================
  # API FastAPI
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: ar-as-api:latest
    container_name: ar-as-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=AR_AS Recommendation System
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_PREFIX=/api/v1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ar_as_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - APM_ENABLED=${APM_ENABLED:-false}
      - APM_SERVER_URL=http://apm-server:8200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - api-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ============================================================================
  # Celery Worker
  # ============================================================================
  celery-worker:
    image: ar-as-api:latest
    container_name: ar-as-worker
    command: >
      celery -A src.modules.module3_orchestration.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ar_as_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - worker-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # Celery Beat (Scheduler)
  # ============================================================================
  celery-beat:
    image: ar-as-api:latest
    container_name: ar-as-beat
    command: >
      celery -A src.modules.module3_orchestration.celery_app beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - beat-data:/tmp
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # Flower (Monitoring Celery)
  # ============================================================================
  flower:
    image: ar-as-api:latest
    container_name: ar-as-flower
    command: >
      celery -A src.modules.module3_orchestration.celery_app flower
      --port=5555
      --persistent=True
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ar-as-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ar_as_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ar-as-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Qdrant (Vector Database)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ar-as-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # MONITORING STACK (Profil: monitoring)
  # Lancer avec: docker compose --profile monitoring up -d
  # ============================================================================

  # Elasticsearch - Stockage des logs et métriques
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ar-as-elasticsearch
    profiles:
      - monitoring
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=ar-as-cluster
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kibana - Interface de visualisation
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ar-as-kibana
    profiles:
      - monitoring
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - xpack.fleet.enabled=false
      - xpack.fleet.agents.enabled=false
      - xpack.observability_ai_assistant.enabled=false
      - SERVER_NAME=ar-as-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # APM Server - Collecte des traces applicatives (mode standalone)
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.11.0
    container_name: ar-as-apm
    profiles:
      - monitoring
    command: >
      apm-server -e
        -E apm-server.host=0.0.0.0:8200
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E apm-server.rum.enabled=true
        -E setup.template.enabled=true
        -E setup.template.settings.index.number_of_replicas=0
        -E apm-server.kibana.enabled=false
        -E monitoring.enabled=false
    ports:
      - "${APM_PORT:-8200}:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  ar-as-network:
    driver: bridge
    name: ar-as-network

volumes:
  api-logs:
  worker-logs:
  beat-data:
  postgres-data:
  redis-data:
  qdrant-data:
  elasticsearch-data:
