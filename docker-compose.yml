# ==============================================================================
# Docker Compose - AR_AS avec Profils Modulaires
# ==============================================================================
# USAGE:
#
#   MODULE 4 UNIQUEMENT (léger, rapide):
#     docker compose --profile module4 up -d
#
#   SYSTEME COMPLET (tous les modules):
#     docker compose --profile full up -d
#
#   AVEC MONITORING (ELK Stack):
#     docker compose --profile full --profile monitoring up -d
#
#   DEVELOPPEMENT Module 4:
#     docker compose --profile dev up -d
#
#   DEVELOPPEMENT Complet:
#     docker compose --profile dev-full up -d
# ==============================================================================

services:
  # ============================================================================
  # API MODULE 4 - Livreur Ranking (LÉGER)
  # ============================================================================
  api-module4:
    build:
      context: .
      target: api-module4
    image: ar-as-module4:latest
    container_name: ar-as-api-module4
    profiles: ["module4"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=AR_AS Module 4 - Livreur Ranking
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_PREFIX=/api/v1
    volumes:
      - module4-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/livreur-ranking/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # ============================================================================
  # API SYSTEME COMPLET
  # ============================================================================
  api:
    build:
      context: .
      target: api-full
    image: ar-as-api:latest
    container_name: ar-as-api
    profiles: ["full"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=AR_AS Recommendation System
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_PREFIX=/api/v1
      # Database
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-recommendation_db}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # APM (optionnel)
      - APM_ENABLED=${APM_ENABLED:-false}
      - APM_SERVER_URL=http://apm-server:8200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # CELERY WORKER (Système complet)
  # ============================================================================
  celery-worker:
    build:
      context: .
      target: worker
    image: ar-as-worker:latest
    container_name: ar-as-worker
    profiles: ["full"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-recommendation_db}
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - worker-logs:/app/logs
    networks:
      - ar-as-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============================================================================
  # CELERY BEAT (Scheduler)
  # ============================================================================
  celery-beat:
    build:
      context: .
      target: beat
    image: ar-as-beat:latest
    container_name: ar-as-beat
    profiles: ["full"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - beat-schedule:/tmp
    networks:
      - ar-as-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # FLOWER (Monitoring Celery)
  # ============================================================================
  flower:
    build:
      context: .
      target: flower
    image: ar-as-flower:latest
    container_name: ar-as-flower
    profiles: ["full"]
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # BASES DE DONNÉES (Système complet)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ar-as-postgres
    profiles: ["full", "dev-full"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-recommendation_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ar-as-redis
    profiles: ["full", "dev-full"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ar-as-qdrant
    profiles: ["full", "dev-full"]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ar-as-network
    restart: unless-stopped

  # ============================================================================
  # DÉVELOPPEMENT - Module 4
  # ============================================================================
  api-dev:
    build:
      context: .
      target: development
    image: ar-as-dev:latest
    container_name: ar-as-api-dev
    profiles: ["dev"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=AR_AS Dev - Module 4
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src:rw
    networks:
      - ar-as-network

  # ============================================================================
  # DÉVELOPPEMENT - Système complet
  # ============================================================================
  api-dev-full:
    build:
      context: .
      target: development-full
    image: ar-as-dev-full:latest
    container_name: ar-as-api-dev-full
    profiles: ["dev-full"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=AR_AS Dev - Full
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:rw
    networks:
      - ar-as-network

  # ============================================================================
  # MONITORING - ELK Stack (Optionnel)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ar-as-elasticsearch
    profiles: ["monitoring"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ar-as-kibana
    profiles: ["monitoring"]
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.11.0
    container_name: ar-as-apm-server
    profiles: ["monitoring"]
    ports:
      - "${APM_PORT:-8200}:8200"
    environment:
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - apm-server.host=0.0.0.0:8200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ar-as-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  ar-as-network:
    driver: bridge
    name: ar-as-network

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  # Application
  module4-logs:
  api-logs:
  worker-logs:
  beat-schedule:
  # Data stores
  postgres-data:
  redis-data:
  qdrant-data:
  # Monitoring
  elasticsearch-data:
