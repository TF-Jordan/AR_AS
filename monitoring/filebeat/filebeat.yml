# Filebeat Configuration for AR_AS Recommendation System
# Collects application logs from mounted volumes and sends to Logstash

filebeat.inputs:
  # API application logs
  - type: log
    enabled: true
    paths:
      - '/var/log/app/api/*.log'
      - '/var/log/app/api/**/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
    fields:
      service_type: api
    fields_under_root: true

  # Celery Worker logs
  - type: log
    enabled: true
    paths:
      - '/var/log/app/worker/*.log'
      - '/var/log/app/worker/**/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
    fields:
      service_type: celery_worker
    fields_under_root: true

# Output to Logstash
output.logstash:
  hosts: ["logstash:5044"]
  loadbalance: true

# Setup Elasticsearch for ILM (Index Lifecycle Management)
setup.ilm.enabled: true
setup.ilm.rollover_alias: "recommendation-logs"
setup.ilm.pattern: "{now/d}-000001"

# Kibana setup for dashboards
setup.kibana:
  host: "http://kibana:5601"
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640

# Monitoring (self-monitoring to Elasticsearch)
monitoring:
  enabled: true
  elasticsearch:
    hosts: ["http://elasticsearch:9200"]
    username: "elastic"
    password: "${ELASTIC_PASSWORD}"
